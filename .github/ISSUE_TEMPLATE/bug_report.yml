name: Bug report
description: 报告可复现的脚本、文档或打包问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 说明预期行为和实际行为。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 提供最小命令、输入类型和失败位置，不要上传客户数据或凭据。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Python、FreeCAD/Gmsh/QFlux 版本（适用时）。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志或证据
      description: 粘贴已脱敏的关键输出。
